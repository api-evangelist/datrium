name: Datrium
description: >-
  Datrium was a Sunnyvale, California enterprise infrastructure company founded in 2012 by Brian Biles
  and Hugo Patterson (both formerly of Data Domain / EMC). Its flagship DVX ("Distributed Virtual X")
  platform introduced an "open convergence" architecture that separated compute from durable storage for
  virtualized data centers, and the company later pivoted toward cloud disaster-recovery-as-a-service
  (Datrium DRaaS with DRaaS Connect and ControlShield). Datrium was backed by Lightspeed Venture Partners,
  NEA, and others, and was acquired by VMware in July 2020, with its technology folded into VMware Cloud
  Disaster Recovery. The company no longer operates independently and publishes no active developer portal
  or public API. This profile is retained in the API Evangelist network as a historical portfolio-company
  record surfaced from Lightspeed Venture Partners' portfolio.
